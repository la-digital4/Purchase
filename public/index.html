<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure User Dashboard - Login</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .error-msg {
      background-color: #fef2f2;
      color: var(--danger);
      border: 1px solid #fee2e2;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      display: none; /* Controlled via JavaScript hidden toggles */
      text-align: center;
      font-weight: 500;
    }

    .footer-notice {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="brand-title">SecurePortal</div>
  <div class="brand-subtitle">Please enter your unique account credentials.</div>
  
  <!-- Client-side error prompt box container -->
  <div id="errorBox" class="error-msg">Invalid username or password.</div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn-submit">Sign In</button>
  </form>

  <div class="footer-notice">
    🔒 Authorized personnel view only. Active sessions are monitored.<br>
    © 2026 SecurePortal. Built securely on Vercel.
  </div>
</div>

<script>
  function handleLogin(event) {
    event.preventDefault(); // Intercept page reload mechanics

    const usernameInput = document.getElementById('username').value.trim();
    const passwordInput = document.getElementById('password').value;
    const errorBox = document.getElementById('errorBox');

    // Hardcoded example credentials check (Replace with your database API calls later)
    if (usernameInput === "Venkatesh" && passwordInput === "password123") {
      errorBox.style.display = "none";
      
      // Store dynamic session flags locally to confirm standard portal practices
      localStorage.setItem("session_active", "true");
      localStorage.setItem("session_user", usernameInput);

      // Route cleanly onto extensionless Vercel edge paths
      window.location.href = '/dashboard';
    } else {
      // Unhide client-facing error alert card elements
      errorBox.style.display = "block";
    }
  }
</script>

</body>
</html>
