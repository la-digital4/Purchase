  <script>
  // If a user clicks 'Back' and lands on the login page while STILL logged in,
  // instantly bounce them back to the dashboard. This breaks the forward button.
  function checkSessionAndRedirect() {
    if (localStorage.getItem('userToken')) {
      window.location.replace('/dashboard.html');
    }
  }

  // Run on initial load
  checkSessionAndRedirect();

   Run if they hit 'Back' into this page from the bfcache
   window.addEventListener('pageshow', function (event) {
   if (event.persisted) {
      checkSessionAndRedirect();
    }
  });
</script>

  <script>
  // Detects if the page was loaded from the browser's Back/Forward cache
  window.addEventListener('pageshow', function (event) {
    if (event.persisted) {
      // Force a hard reload from the server to re-trigger authentication checks
      window.location.reload();
    }
  });
</script>

  <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">

  <script>
  // 4. FORCE REFRESH FIELD WIPE ON WINDOW FOCUS / PAGE LOAD
  window.addEventListener('pageshow', function(event) {
    document.getElementById('username').value = "";
    document.getElementById('password').value = "";
  });

  // Keep your existing handleLogin(event) function directly below this...
</script>
  
  <div class="footer-notice">
    🔒 Authorized personnel view only. Active sessions are monitored.<br>
    © 2026 SecurePortal. Built securely, Monitored & Maintained by LA projects Department.
  </div>
</div>

<script>
  function handleLogin(event) {
  event.preventDefault();

  const usernameInput = document.getElementById('username').value.trim();
  const passwordInput = document.getElementById('password').value;
  const errorBox = document.getElementById('errorBox');

  // Submit credentials to your Vercel serverless gateway endpoint
  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: usernameInput, password: passwordInput })
  })
  .then(res => res.json())
  .then(data => {
if (data.success) {
  errorBox.style.display = "none";

  // Clear the failed attempts tracker on a successful login
  sessionStorage.removeItem("failed_login_attempts");   
  // Save data values to your browser storage framework scope
  localStorage.setItem("session_active", "true");
  localStorage.setItem("session_user", data.user.username);

  // CORRECTED: Overwrites the browser history so the 'Back' button won't loop back here
  window.location.replace('/dashboard');
} else {
 // 1. Retrieve the current failure count from memory or default to 0
  let currentAttempts = parseInt(sessionStorage.getItem("failed_login_attempts")) || 0;
  
  // 2. Increment the counter by 1
  currentAttempts += 1;
  
  // 3. Save the new count back to the browser session
  sessionStorage.setItem("failed_login_attempts", currentAttempts);
  
  // 4. Inject the counter directly into the text span
  document.getElementById("attemptCount").innerText = currentAttempts;
  
  // 5. Unhide and display the dynamic alert card element
  errorBox.style.display = "block";
}

  })
  .catch(err => {
    console.error("Authentication Error:", err);
    errorBox.innerText = "Network error. Please try again later.";
    errorBox.style.display = "block";
  });
}

</script>
