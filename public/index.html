<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure User Dashboard - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
        }

        /* Split-screen layout wrapper */
        .page-container {
            display: flex;
            min-height: 100vh;
            width: 100vw;
        }

        /* Left Side: Login Form Column */
        .login-column {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-color: #f8fafc;
            z-index: 2;
        }

        /* Login Card Panel */
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .logo-img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .portal-title {
            text-align: center;
            font-size: 1.5rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .portal-subtitle {
            text-align: center;
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        /* Error Message Alert Style */
        .alert-error {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #334155;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        /* Notice & Footer Text */
        .security-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2rem;
            text-align: center;
            line-height: 1.4;
        }

        .footer-text {
            font-size: 0.7rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 1rem;
            line-height: 1.4;
        }

        /* Right Side: Slideshow Viewport */
        .slideshow-column {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* CSS-Only Slideshow Engine Track */
        .slideshow-engine {
            display: flex;
            width: 300%; /* Sized for 3 separate horizontal slider images */
            height: 100%;
            animation: slideLayoutAnimation 15s infinite ease-in-out;
        }

        .slide {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Image targets from your project's public folder */
        .slide-1 { background-image: url('/slide1.jpg'); }
        .slide-2 { background-image: url('/slide2.jpg'); }
        .slide-3 { background-image: url('/slide3.jpg'); }

        .slideshow-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.3));
            pointer-events: none;
        }

        /* Keyframes for sliding animation loop across 3 panels */
        @keyframes slideLayoutAnimation {
            0%, 28% { transform: translateX(0%); }
            33%, 61% { transform: translateX(-33.3333%); }
            66%, 95% { transform: translateX(-66.6666%); }
            100% { transform: translateX(0%); }
        }

        /* Responsive Breakpoint for Mobile Portrait Screens */
        @media (max-width: 768px) {
            .slideshow-column {
                display: none; /* Collapses slider area entirely on small screens */
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        
        <!-- LEFT COLUMN: Form Container -->
        <div class="login-column">
            <div class="login-card">
                
                <!-- Logo Asset Component -->
                <div class="logo-container">
                    <img src="/logo.png" alt="Company Logo" class="logo-img">
                </div>

                <h2 class="portal-title">LA Projects Portal</h2>
                <p class="portal-subtitle">Please enter your unique account credentials.</p>

                <!-- Error Warning Block -->
                <div class="alert-error">
                    Invalid username or password. (0 unsuccessful attempts)
                </div>

                <!-- Input Submission Form Elements -->
                <form action="#" method="POST" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Enter username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="submit-btn">Sign In</button>
                </form>

                <!-- System Notice Block -->
                <div class="security-notice">
                    <span>🔒</span> Authorized personnel view only. Active sessions are monitored.
                </div>
                
                <!-- Legal & Maintenance Attribution Details -->
                <div class="footer-text">
                    &copy; 2026 SecurePortal. Built securely, Monitored & Maintained by LA projects Department.
                </div>

            </div>
        </div>

        <!-- RIGHT COLUMN: Slideshow Track -->
        <div class="slideshow-column">
            <div class="slideshow-engine">
                <div class="slide slide-1"></div>
                <div class="slide slide-2"></div>
                <div class="slide slide-3"></div>
            </div>
            <div class="slideshow-overlay"></div>
        </div>

    </div>

</body>
</html>
