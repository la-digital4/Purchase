<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure User Dashboard - Login</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --panel-bg: #e67a8a;
      --text-main: #e4032c;
      --text-muted: #080808;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #fad550;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* Split-screen layout wrapper */
    .page-container {
      display: flex;
      min-height: 100vh;
      width: 100vw;
    }

    /* Left Side: Login Form Column */
    .login-column {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background-color: #22308e;
      z-index: 2;
    }

    /* Login Card Panel */
    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .error-msg {
      background-color: #fef2f2;
      color: var(--danger);
      border: 1px solid #fee2e2;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      display: none; /* Controlled via JavaScript */
      text-align: center;
      font-weight: 500;
    }

    .footer-notice {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }

    /* Right Side: Slideshow Viewport */
    .slideshow-column {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: #0f172a;
    }

    /* CSS-Only Slideshow Engine Track */
    .slideshow-engine {
      display: flex;
      width: 300%; /* Sized for 3 separate horizontal slider images */
      height: 100%;
      animation: slideLayoutAnimation 15s infinite ease-in-out;
    }

    .slide {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Image targets from public folder */
    .slide-1 { background-image: url('/slide1.jpg'); }
    .slide-2 { background-image: url('/slide2.jpg'); }
    .slide-3 { background-image: url('/slide3.jpg'); }

    .slideshow-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.3));
      pointer-events: none;
    }

    /* Keyframes for sliding animation loop across 3 panels */
    @keyframes slideLayoutAnimation {
      0%, 28% { transform: translateX(0%); }
      33%, 61% { transform: translateX(-33.3333%); }
      66%, 95% { transform: translateX(-66.6666%); }
      100% { transform: translateX(0%); }
    }

    /* Responsive Breakpoint for Mobile Portrait Screens */
    @media (max-width: 768px) {
      .slideshow-column {
        display: none; /* Collapses slider area entirely on small screens */
      }
    }
  </style>

  <script>
    // Session state and validation handling
    function checkSessionAndRedirect() {
      if (localStorage.getItem('session_active') === 'true' || localStorage.getItem('userToken')) {
        window.location.replace('/dashboard');
      }
    }

    // Run on initial load
    checkSessionAndRedirect();

    // Monitor back-button caches and force page state refreshes
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        checkSessionAndRedirect();
        window.location.reload();
      }
    });
  </script>
</head>
<body>

  <div class="page-container">
    
    <!-- LEFT COLUMN: Login Panel Framework -->
    <div class="login-column">
      <div class="login-container">
        <div style="display: flex; justify-content: center; padding-top: 25px; padding-bottom: 10px; width: 100%;">
          <img src="/Logo.png" alt="Company Logo" style="height: 45px; width: auto; object-fit: contain;">
        </div>

        <div class="brand-title">LA Projects Portal</div>
        <div class="brand-subtitle">Please enter your unique account credentials.</div>
        
        <!-- Client-side error prompt box container -->
        <div id="errorBox" class="error-msg">
          Invalid username or password. (<span id="attemptCount">0</span> unsuccessful attempts)
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" autocomplete="off" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" autocomplete="off" required>
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="footer-notice">
          🔒 Authorized personnel view only. Active sessions are monitored.<br>
          © 2026 SecurePortal. Built securely, Monitored & Maintained by LA projects Department.
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Slideshow Track -->
    <div class="slideshow-column">
      <div class="slideshow-engine">
        <div class="slide slide-1"></div>
        <div class="slide slide-2"></div>
        <div class="slide slide-3"></div>
      </div>
      <div class="slideshow-overlay"></div>
    </div>

  </div>

  <script>
    // Force clean fields on focus state
    window.addEventListener('pageshow', function(event) {
      document.getElementById('username').value = "";
      document.getElementById('password').value = "";
    });

    // Form execution logic
    function handleLogin(event) {
      event.preventDefault();

      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;
      const errorBox = document.getElementById('errorBox');

      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: usernameInput, password: passwordInput })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          errorBox.style.display = "none";
          sessionStorage.removeItem("failed_login_attempts");   
          localStorage.setItem("session_active", "true");
          localStorage.setItem("session_user", data.user.username);
          window.location.replace('/dashboard');
        } else {
          let currentAttempts = parseInt(sessionStorage.getItem("failed_login_attempts")) || 0;
          currentAttempts += 1;
          sessionStorage.setItem("failed_login_attempts", currentAttempts);
          document.getElementById("attemptCount").innerText = currentAttempts;
          errorBox.style.display = "block";
        }
      })
      .catch(err => {
        console.error("Authentication Error:", err);
        errorBox.innerText = "Network error. Please try again later.";
        errorBox.style.display = "block";
      });
    }
  </script>

</body>
</html>
