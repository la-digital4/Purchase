<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Purchase Request</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .back-btn:hover {
      color: var(--accent);
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select, textarea {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    /* Items Table Styling */
    .items-section {
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      padding: 0.75rem;
      border-bottom: 2px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    td {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .btn-add {
      background: none;
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 1rem;
      transition: all 0.2s;
    }

    .btn-add:hover {
      background: #eff6ff;
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.25rem;
    }

    /* Summary Bar */
    .summary-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* Action Buttons */
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .btn-submit {
      background-color: var(--accent);
      color: white;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-cancel {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .btn-cancel:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-nav">
    <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
  </div>

  <div class="card">
    <h1>Create Purchase Request</h1>
    
    <form id="purchaseForm" onsubmit="handleSubmit(event)">
      <!-- Request Meta Details -->
      <div class="form-grid">
        <div class="form-group">
          <label for="department">Department</label>
          <select id="department" required>
            <option value="">Select Department</option>
            <option value="it">Information Technology</option>
            <option value="hr">Human Resources</option>
            <option value="ops">Operations</option>
            <option value="marketing">Marketing</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">Priority Level</label>
          <select id="priority" required>
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="purpose">Business Justification / Purpose</label>
          <textarea id="purpose" rows="3" placeholder="Describe why these items are required..." required></textarea>
        </div>
      </div>

      <!-- Itemized Request Table -->
      <div class="items-section">
        <label>Requested Items</label>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 50%;">Item Description</th>
                <th style="width: 15%;">Qty</th>
                <th style="width: 25%;">Est. Unit Price ($)</th>
                <th style="width: 10%;"></th>
              </tr>
            </thead>
            <tbody id="itemTableBody">
              <tr>
                <td><input type="text" placeholder="e.g., Dell 27 Hint Monitor" style="width:100%;" required></td>
                <td><input type="number" value="1" min="1" class="qty-input" style="width:100%;" oninput="calculateTotal()" required></td>
                <td><input type="number" placeholder="0.00" step="0.01" min="0" class="price-input" style="width:100%;" oninput="calculateTotal()" required></td>
                <td style="text-align: center;"><button type="button" class="btn-remove" onclick="removeItem(this)">×</button></td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <button type="button" class="btn-add" onclick="addItem()">+ Add Another Item</button>
      </div>

      <!-- Total Calculator Banner -->
      <div class="summary-bar">
        <span>Estimated Total:</span>
        <span id="grandTotal">$0.00</span>
      </div>

      <!-- Submit Elements -->
      <div class="actions">
        <button type="button" class="btn btn-cancel" onclick="window.location.href='/dashboard'">Cancel</button>
        <button type="submit" class="btn btn-submit">Submit Request</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Dynamically inject a new blank row into the items table
  function addItem() {
    const tbody = document.getElementById('itemTableBody');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" placeholder="Item description" style="width:100%;" required></td>
      <td><input type="number" value="1" min="1" class="qty-input" style="width:100%;" oninput="calculateTotal()" required></td>
      <td><input type="number" placeholder="0.00" step="0.01" min="0" class="price-input" style="width:100%;" oninput="calculateTotal()" required></td>
      <td style="text-align: center;"><button type="button" class="btn-remove" onclick="removeItem(this)">×</button></td>
    `;
    tbody.appendChild(row);
    calculateTotal();
  }

  // Remove targeted row and re-evaluate total math
  function removeItem(button) {
    const row = button.closest('tr');
    const tbody = document.getElementById('itemTableBody');
    if (tbody.rows.length > 1) {
      row.remove();
      calculateTotal();
    } else {
      alert("Your request must contain at least one item.");
    }
  }

  // Live total sum tally
  function calculateTotal() {
    let grandTotal = 0;
    const rows = document.querySelectorAll('#itemTableBody tr');
    
    rows.forEach(row => {
      const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
      const price = parseFloat(row.querySelector('.price-input').value) || 0;
      grandTotal += qty * price;
    });

    document.getElementById('grandTotal').innerText = `$${grandTotal.toFixed(2)}`;
  }

  // Form Submission Logic
  function handleSubmit(event) {
    event.preventDefault();
    alert('Purchase request successfully captured! Ready to link to your backend API.');
  }
</script>

</body>
</html>
