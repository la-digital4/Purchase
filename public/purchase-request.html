<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Purchase Request</title>

  <!-- 🔒 SESSION SECURITY & BACK-BUTTON GUARD -->
  <script>
    // 1. If a logged-out user tries to access this page, instantly bounce them to login
    if (localStorage.getItem("session_active") !== "true") {
      window.location.replace('/');
    }

    // 2. Force a server reload if the page is pulled from the browser's back/forward memory cache (bfcache)
    window.addEventListener('pageshow', function (event) {
      if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
        window.location.reload();
      }
    });
  </script>

  <!-- Your existing CSS stylesheets or Tailwind links go here -->
</head>
<body>

  <!-- Your existing navigation/layout container wrapper -->
  <div>
    <!-- Back to Dashboard Link: Ensure it targets the clean extensionless path -->
    <a href="/dashboard" id="backToDashboard">← Back to Dashboard</a>

    <h1>Create Purchase Request</h1>

    <form id="purchaseRequestForm">
      <label>Department</label>
      <select name="department">
        <option value="">Select Department</option>
        <option value="inventory">Inventory & Logistics</option>
        <option value="it">Information Technology</option>
        <option value="operations">Operations</option>
        <option value="procurement">Procurement</option>
      </select>

      <label>Priority Level</label>
      <select name="priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="urgent">Urgent</option>
      </select>

      <label>Business Justification / Remarks</label>
      <textarea name="remarks"></textarea>

      <!-- Inventory Order Items Table Section -->
      <h3>Inventory Order Items</h3>
      <table>
        <thead>
          <tr>
            <th>S.No</th>
            <th>Vendor Name</th>
            <th>Product Name</th>
            <th>Packing Details</th>
            <th>Unit Cost ($)</th>
            <th>Par Stock Level</th>
            <th>Stock In Hand</th>
            <th>Order Qty</th>
            <th>Net Amt ($)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td><!-- Input fields --></td>
            <!-- Remaining table cell items -->
            <td><button type="button">×</button></td>
          </tr>
        </tbody>
      </table>

      <button type="button">+ Add Row</button>
      <p>Estimated Grand Total: $0.00</p>

      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit">Submit Request</button>
    </form>
  </div>

  <!-- 💡 Extra JavaScript Logic for the Cancel Button -->
  <script>
    document.getElementById('cancelBtn').addEventListener('click', function() {
      window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
